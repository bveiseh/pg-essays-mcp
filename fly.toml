app = "pg-essays-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  PUBLIC_HOST = "pg-essays-mcp.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

  [[http_service.checks]]
    grace_period = "1m"
    interval = "60s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[mounts]]
  source = "pg_essays_data"
  destination = "/data"
  initial_size = "1gb"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1gb"
  auto_extend_size_limit = "5gb"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
